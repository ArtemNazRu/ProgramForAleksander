          PROJECT_EOF
          tar -xJf project.txz
          A=finpath-android/app/src/main/assets
          mkdir -p $A/fonts
          curl -sfL -o $A/fonts/Unbounded.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -sfL -o $A/fonts/GolosText.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/golostext/GolosText%5Bwght%5D.ttf"
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 finpath-android/tools/make_icons.py $A
          ls -la $A $A/fonts

      - name: Сборка APK
        working-directory: finpath-android
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FinPath.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FinPath-apk
          path: FinPath.apk

      - name: Подготовить сайт для iPhone
        run: |
          mkdir -p site
          cp -r finpath-android/app/src/main/assets/. site/
          cp FinPath.apk site/FinPath.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
