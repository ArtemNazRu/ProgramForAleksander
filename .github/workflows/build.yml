name: Собрать APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка
        run: |
          if [ ! -f settings.gradle ]; then cd "$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")"; fi
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FinPath.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FinPath-apk
          path: FinPath.apk
